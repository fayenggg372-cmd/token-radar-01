<!--
  Token Radar radar-3. How to read this page:
  - The board ranks pre-token protocols by implied value: TVL x 0.25, grown
    by seven-day growth, matured by age with no token, widened by chains.
  - Heat (0-100) is the early warning: growth against the protocol's own
    category median, youth, size against the $50M floor, breadth, and
    absolute growth. It never moves the rank.
  - Every farm plan is eight steps with a cost and a time, derived from the
    protocol's own category, chains, TVL and age — never from a list of names.
  - Risk is a snapshot heuristic only: no audit, holder or honeypot data
    ships in the snapshot, so no badge here is a safety verdict.
  - The page renders with no network: all data ships in data.js beside it.
-->
<a class="skip" href="#board">Skip to the board</a>

<noscript><p class="noscript">Token Radar needs JavaScript: the board, the charts and the farm plans are rendered in your browser from the snapshot data shipped with this page. No network is used.</p></noscript>
